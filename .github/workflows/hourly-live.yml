name: Hourly Trackformer 1.2 inference
on:
  schedule:
    - cron: '7 * * * *' # Recovery watchdog, not the primary hourly clock.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release_tools/hourly_live.py --gate
  hourly:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: trackformer-hourly-live-only
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/hourly-live.yml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .forecast-cache
          key: hourly-live-inputs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hourly-live-inputs-${{ runner.os }}-
      - name: Install frozen CPU inference dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.4 xarray==2025.6.1 netCDF4==1.7.2 eccodes==2.43.0 matplotlib==3.10.7
      - name: Test hourly identity and causal contract
        env:
          PYTHONPATH: release_tools
        run: python -m unittest test_hourly_live test_automatic_forecasts test_ensemble_forecast test_live_pressure_export
      - name: Open independent hourly output branch
        run: |
          git init "$RUNNER_TEMP/hourly-output"
          cd "$RUNNER_TEMP/hourly-output"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git config user.name 'Trackformer forecast automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/live-hourly-data; then
            git fetch --depth=1 origin live-hourly-data
            git switch --create live-hourly-data FETCH_HEAD
          else
            git switch --orphan live-hourly-data
          fi
      - name: Recompute fifty members every hour and publish each verified run
        run: python -B release_tools/hourly_live.py --output "$RUNNER_TEMP/hourly-output/data" --cache .forecast-cache --session-minutes 295
      - name: Hand off to the next bounded cloud session
        if: success()
        run: python release_tools/hourly_live.py --chain
