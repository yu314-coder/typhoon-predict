name: Automatic Trackformer 1.2 forecasts
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      historical_limit:
        description: Maximum historical storm issues in this resumable batch
        default: '500'
        type: string
      only_id:
        description: Optional exact historical issue ID for a targeted retry
        default: ''
        type: string
permissions:
  contents: write
  actions: write # Dispatch the next serialized archive batch after publishing.
concurrency:
  group: trackformer-1-2-automatic-forecast-archive
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HISTORICAL_LIMIT: ${{ inputs.historical_limit || '500' }}
      ONLY_ID: ${{ inputs.only_id }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .forecast-cache
          # Caches are immutable: each run saves its newly fetched analyses.
          key: trackformer-1-2-inputs-${{ runner.os }}-v2-${{ github.run_id }}
          restore-keys: |
            trackformer-1-2-inputs-${{ runner.os }}-v2-
            trackformer-1-2-inputs-${{ runner.os }}-v1
      - name: Install CPU inference and weather readers
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.4 xarray==2025.6.1 netCDF4==1.7.2 eccodes==2.43.0 matplotlib==3.10.7
      - name: Test causal readers and continuation policy
        env:
          PYTHONPATH: release_tools
        run: python -m unittest discover -s release_tools -p 'test_*.py'
      - name: Open resumable output branch
        run: |
          git init "$RUNNER_TEMP/forecast-data"
          cd "$RUNNER_TEMP/forecast-data"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          if git ls-remote --exit-code origin refs/heads/forecast-data; then
            git fetch --depth=1 origin forecast-data
            git switch --create forecast-data FETCH_HEAD
          else
            git switch --orphan forecast-data
          fi
      - name: Live forecasts first, then bounded historical backfill
        run: |
          args=()
          if [ -n "$ONLY_ID" ]; then args+=(--only-id "$ONLY_ID"); fi
          python release_tools/automatic_forecasts.py --output "$RUNNER_TEMP/forecast-data/data" --cache .forecast-cache --historical-limit "$HISTORICAL_LIMIT" --minutes 45 "${args[@]}"
      - name: Verify every completed planned issue and pressure sequence
        id: archive_verification
        run: |
          python release_tools/verify_forecast_archive.py --output "$RUNNER_TEMP/forecast-data/data" --manifest .forecast-cache/input-manifest.json
      - name: Publish complete outputs without replacing earlier issues
        if: always() && steps.archive_verification.outcome == 'success'
        run: |
          cd "$RUNNER_TEMP/forecast-data"
          if [ ! -f data/catalog.json ]; then exit 1; fi
          git config user.name 'Trackformer forecast automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update verified 1.2 forecast archive ($GITHUB_RUN_ID)"
            git push origin HEAD:forecast-data
          fi
          python -c "import json; d=json.load(open('data/status.json')); print('Historical forecasts:',d['historical_completed'],'/',d['historical_total']); print('Live issues:',d['live_issues']); print('Source errors:',len(d['errors']))"
      - name: Decide whether another productive batch is ready
        id: continuation
        if: success()
        env:
          PYTHONPATH: release_tools
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from backfill_queue import should_continue
          status = json.loads((Path(os.environ['RUNNER_TEMP']) / 'forecast-data/data/status.json').read_text())
          ready = should_continue(status, os.environ['RUN_URL'], os.environ.get('ONLY_ID', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ready={str(ready).lower()}\n")
          print('Continue immediately:', ready, 'ready:', status.get('historical_ready'),
                'cooling down:', status.get('historical_cooling_down'))
          PY
      - name: Queue the next batch immediately
        if: success() && inputs.only_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release_tools/cloud_continuation.py --output "$RUNNER_TEMP/forecast-data/data"
