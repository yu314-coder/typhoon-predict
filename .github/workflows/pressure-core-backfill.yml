name: Backfill verified Trackformer 1.2 pressure cores and model wind
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum immutable issue core/wind exports in this batch
        default: '500'
        type: string
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  # Share the existing output-branch lock; never race a live forecast publish.
  group: trackformer-1-2-automatic-forecast-archive
  cancel-in-progress: false
jobs:
  pressure-cores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CORE_LIMIT: ${{ inputs.limit || '500' }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .forecast-cache
          key: trackformer-1-2-inputs-${{ runner.os }}-v2-core-${{ github.run_id }}
          restore-keys: |
            trackformer-1-2-inputs-${{ runner.os }}-v2-
      - name: Install pinned original CPU readers
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.4 xarray==2025.6.1 netCDF4==1.7.2 eccodes==2.43.0 matplotlib==3.10.7
      - name: Test geographic registration and plain/gzip archive preservation
        env:
          PYTHONPATH: release_tools
        run: python -m unittest discover -s release_tools -p 'test_*.py'
      - name: Open the existing output branch
        run: |
          git init "$RUNNER_TEMP/forecast-data"
          cd "$RUNNER_TEMP/forecast-data"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git fetch --depth=1 origin forecast-data
          git switch --create forecast-data FETCH_HEAD
      - name: Prioritize and publish fresh live forecasts inside the archive lock
        # First give live updates a turn inside the SAME output-branch lock.
        # This prevents a perpetual history chain from starving the live job.
        id: live_priority
        run: |
          due=$(python release_tools/cloud_continuation.py --output "$RUNNER_TEMP/forecast-data/data" --check-live)
          if [ "$due" = true ]; then
            python release_tools/automatic_forecasts.py --output "$RUNNER_TEMP/forecast-data/data" --cache .forecast-cache --historical-limit 0 --minutes 12
            python release_tools/verify_forecast_archive.py --output "$RUNNER_TEMP/forecast-data/data" --manifest .forecast-cache/input-manifest.json
            cd "$RUNNER_TEMP/forecast-data"
            git config user.name 'Trackformer forecast automation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/forecasts data/fields data/live50 data/catalog.json data/status.json data/coverage.json data/verification.json
            if ! git diff --cached --quiet; then
              git commit -m "Publish fresh causal live issues before history recovery ($GITHUB_RUN_ID)"
              git push origin HEAD:forecast-data
            fi
            echo 'core_minutes=25' >> "$GITHUB_OUTPUT"
          else
            echo 'core_minutes=40' >> "$GITHUB_OUTPUT"
          fi
      - name: Replay causal inputs once and append missing core fields and learned wind
        run: |
          python release_tools/pressure_core_backfill.py --output "$RUNNER_TEMP/forecast-data/data" --cache .forecast-cache --limit "$CORE_LIMIT" --minutes "${{ steps.live_priority.outputs.core_minutes }}"
      - name: Audit recovered exports before publishing
        run: |
          python release_tools/verify_pressure_core_archive.py --output "$RUNNER_TEMP/forecast-data/data" --manifest .forecast-cache/input-manifest.json
          python release_tools/verify_auxiliary_wind_archive.py --output "$RUNNER_TEMP/forecast-data/data" --manifest .forecast-cache/input-manifest.json
      - name: Publish only the separate core-field and model-wind namespaces
        run: |
          cd "$RUNNER_TEMP/forecast-data"
          git config user.name 'Trackformer forecast automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pressure-cores data/model-wind
          if ! git diff --cached --quiet; then
            git commit -m "Append verified pressure cores and auxiliary wind ($GITHUB_RUN_ID)"
            git push origin HEAD:forecast-data
          fi
      - name: Continue only after productive verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release_tools/cloud_continuation.py --output "$RUNNER_TEMP/forecast-data/data"
      - name: Report zero-progress replay failures after publishing partial receipts
        run: |
          python release_tools/cloud_continuation.py --output "$RUNNER_TEMP/forecast-data/data" --check-recovery-progress
