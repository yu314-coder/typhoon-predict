name: Trackformer 1.3.12 exact native source download
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1312-native-source-cloud-20261009
  cancel-in-progress: false
jobs:
  download:
    if: github.actor_id == '174002717' && github.ref == 'refs/heads/main' && github.repository == 'yu314-coder/typhoon-predict'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: v1312-native-source-cloud-20261009
    steps:
      - name: Read the exact dispatched code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify pinned transport and fixture checks (no credentials)
        working-directory: release_tools
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          pinned = {
              'v1312_cloud_sources.py': '7a1c2f1af8437fd9b230f09092541aa7ac634f825acfa78f01f06c51a9fc99f9',
              'test_v1312_cloud_sources.py': '86c4fa3b53894ba4ed308fa2aacd524dd4c82d037308ba99955f9423922ae0b3',
              'v1312-cloud-source-plan.json': 'a6dc54241732b89e2107e9bc6857177a09b344ae68cc04c18627e00eec2c01cd',
          }
          for name, expected in pinned.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Pinned transport identity changed; no credential access')
          PY
          python3 -B -m unittest -v test_v1312_cloud_sources
      - name: Download unchanged native sources into single-file Drive destinations
        env:
          V1312_UPLOAD_CAPABILITIES_0: ${{ secrets.V1312_UPLOAD_CAPABILITIES_0 }}
          V1312_UPLOAD_CAPABILITIES_1: ${{ secrets.V1312_UPLOAD_CAPABILITIES_1 }}
          V1312_UPLOAD_CAPABILITIES_2: ${{ secrets.V1312_UPLOAD_CAPABILITIES_2 }}
          V1312_UPLOAD_CAPABILITIES_3: ${{ secrets.V1312_UPLOAD_CAPABILITIES_3 }}
          V1312_UPLOAD_CAPABILITIES_4: ${{ secrets.V1312_UPLOAD_CAPABILITIES_4 }}
          V1312_UPLOAD_CAPABILITIES_5: ${{ secrets.V1312_UPLOAD_CAPABILITIES_5 }}
          V1312_UPLOAD_CAPABILITIES_6: ${{ secrets.V1312_UPLOAD_CAPABILITIES_6 }}
          V1312_UPLOAD_CAPABILITIES_7: ${{ secrets.V1312_UPLOAD_CAPABILITIES_7 }}
        run: |
          exec python3 -B release_tools/v1312_cloud_sources.py --plan release_tools/v1312-cloud-source-plan.json --scratch "${RUNNER_TEMP}/v1312-native-sources"
