name: Refresh 1.3.14b live Taiwan rainfall

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions: {}

concurrency:
  group: rainfall-v1314b-e3-sites-cpu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Advance the qualified Sites CPU forecast and verify stored fields
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const origin='https://trackformer-weatherlab.rudin-euler-8253.chatgpt.site';
          const checkpoint='53545b3cce06b7f16f8023a213fac3f455cc37730e6b923ef46071562b245673';
          let previous=null,complete=null;
          for(let call=0;call<32;call++){
            const response=await fetch(origin+'/api/rainfall/v1314b/refresh',{method:'POST',signal:AbortSignal.timeout(150000)});
            const result=await response.json();
            if(!response.ok)throw Error(JSON.stringify(result));
            console.log(JSON.stringify({call:call+1,...result}));
            if(result.busy||result.waiting_for_source){console.log('Deferred: the existing writer or exact weather source is not ready. No duplicate or fallback forecast.');process.exit(0);}
            if(result.qualification_pending)throw Error('The expected hosted E3 qualification is absent; no promotion or fallback.');
            if(result.complete&&result.published){complete=result;break;}
            assert.equal(result.in_progress,true);
            assert.equal(result.checkpoint_sha256,checkpoint);
            assert.equal(result.CPU_only,true);
            assert.equal(result.Mac_required,false);
            assert.equal(result.training_untouched,true);
            assert.equal(result.total_stages,82);
            if(previous&&previous.id===result.id)assert.ok(result.cursor>previous.cursor,'No committed stage progress; inspect before another attempt.');
            previous=result;
          }
          assert.ok(complete,'Bounded run ended without a complete committed forecast.');
          const response=await fetch(origin+'/api/rainfall/live?model=v1314b',{signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200);
          const data=await response.json();
          assert.equal(data.schema,'v1314b-Taiwan-E3-live-CPU-v1');
          assert.equal(data.checkpoint_sha256,checkpoint);
          assert.equal(data.id,complete.id);
          assert.equal(data.models[0].key,'v1314b_e3');
          assert.equal(data.models[1].key,'gfs');
          assert.equal(data.hosted_qualification.complete,true);
          assert.equal(data.hosted_qualification.checkpoint_sha256,checkpoint);
          assert.equal(data.execution,'Sites_Workers_CPU_static_WASM_FP32');
          assert.equal(data.Mac_required,false);
          assert.equal(data.training_untouched,true);
          assert.equal(data.future_labels_as_inputs,false);
          assert.equal(data.observation_windows_scored,0);
          assert.equal(data.accuracy_metrics,null);
          assert.deepEqual(data.leads_hours,Array.from({length:20},(_,i)=>6*(i+1)));
          assert.deepEqual(data.history_offsets_hours,Array.from({length:9},(_,i)=>6*(i-8)));
          const anchor=Date.parse(data.initialization_utc),now=Date.now();
          assert.ok(Number.isFinite(anchor)&&anchor%21600000===0&&now>=anchor&&now-anchor<=12*3600000);
          assert.ok(data.generated_unix>=data.forecast_issued_unix&&data.generated_unix*1000<=now+300000);
          assert.equal(data.grids.taiwan_box.rows,16);
          assert.equal(data.grids.taiwan_box.columns,10);
          assert.equal(data.grids.taiwan_box.resolution_degrees,.25);
          for(const role of ['GFS_f000_WP025','GFS_f000_global1']){
            const times=data.sources.filter(s=>s.role===role).map(s=>Date.parse(s.initialization_utc)).sort((a,b)=>a-b);
            assert.deepEqual(times,Array.from({length:9},(_,i)=>anchor+(i-8)*21600000));
          }
          const peers=data.sources.filter(s=>s.role==='GFS_comparison_only_not_input');
          assert.equal(peers.length,20);
          peers.forEach((p,i)=>{assert.equal(p.start_lead_hours,i*6);assert.equal(p.end_lead_hours,(i+1)*6);});
          const fields=data.models.flatMap(model=>Object.entries(model.regions).map(([region,record])=>({model:model.key,region,record})));
          fields.push({model:'v1314b_e3_risk',region:'taiwan_box',record:data.warning_risk_probability});
          for(const {model,region,record}of fields){
            const expectedPath=`/api/rainfall/live/fields/${data.id}/${model}/${region}`;
            assert.equal(record.asset,expectedPath);
            const r=await fetch(origin+expectedPath,{signal:AbortSignal.timeout(60000)});
            assert.equal(r.status,200);
            const bytes=Buffer.from(await r.arrayBuffer()),risk=model.endsWith('_risk'),grid=data.grids[region];
            assert.equal(bytes.length,20*grid.rows*grid.columns*4*(risk?4:1));
            assert.equal(bytes.length,record.bytes);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),record.sha256);
            for(let i=0;i<bytes.length;i+=4){const v=bytes.readFloatLE(i);assert.ok(Number.isFinite(v)&&v>=0&&(!risk||v<=1),'Invalid rainfall or risk field.');}
            console.log(JSON.stringify({verified:true,model,region,bytes:bytes.length,sha256:record.sha256,all20leads:true}));
          }
          console.log(JSON.stringify({complete:true,id:data.id,initialization_utc:data.initialization_utc,checkpoint_sha256:checkpoint,CPU_only:true,Mac_required:false,training_untouched:true,accuracy_evidence:false}));
          NODE
