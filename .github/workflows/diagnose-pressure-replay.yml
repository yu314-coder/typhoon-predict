name: Diagnose unresolved immutable pressure replays (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trackformer-immutable-replay-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .forecast-cache
          key: trackformer-1-2-inputs-${{ runner.os }}-v2-probe-${{ github.run_id }}
          restore-keys: |
            trackformer-1-2-inputs-${{ runner.os }}-v2-
      - name: Install original CPU runtime and exact source readers
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.3 requests==2.32.4 xarray==2025.6.1 netCDF4==1.7.2 eccodes==2.43.0
      - name: Pin current archive and compare fixed CPU execution profiles without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/forecast-data" --jq '.object.sha')
          python release_tools/probe_archive_replay.py --output "$RUNNER_TEMP/replay-diagnosis" --cache .forecast-cache --archive-sha "$archive_sha"
      - name: Upload diagnostics only (no inputs, weights or replacement forecasts)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-replay-diagnosis
          path: ${{ runner.temp }}/replay-diagnosis/diagnosis.json
          if-no-files-found: error
          retention-days: 7
